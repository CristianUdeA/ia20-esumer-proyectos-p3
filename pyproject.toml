[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pqrs-local"
version = "0.1.0"
description = "API local de clasificación y borradores consultivos de PQRS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "pydantic>=2.6,<3.0",
    "google-genai>=0.3",
    "google-cloud-storage>=2.16",
    "google-cloud-secret-manager>=2.19",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27",
    "pytest>=8.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

